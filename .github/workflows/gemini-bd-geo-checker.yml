name: BD & GEO Independent Checker (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'retaining-wall-checker/src/**'
      - '.github/gemini/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-checker-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  independent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gemini BD/GEO Independent Checker
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: set a repo variable GEMINI_MODEL to change the model.
          # An exact model id, or a name like 'Gemini 4 Argon' matched against the key's model list.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-argon' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const MARKER = '<!-- gemini-bd-geo-checker -->';
            console.log("Triggering Gemini BD & GEO Independent Check...");

            // Files that hold engineering calculations
            const CALC = /^retaining-wall-checker\/src\/.*\.(html|js|mjs|ts)$/;
            const MAX_CHARS = 800000; // keep request well under the model context

            const postReview = async (text) => {
              const body = `${MARKER}\n## BD & GEO Independent Check (Gemini \`${process.env.GEMINI_MODEL}\`)\n\n` +
                text.slice(0, 60000) +
                `\n\n---\n_Automated independent check. It does not replace a qualified checking engineer._`;
              await github.rest.pulls.createReview({ owner, repo, pull_number, event: 'COMMENT', body });
              await core.summary.addRaw(body).write();
            };

            if (!process.env.GEMINI_API_KEY) {
              core.warning('GEMINI_API_KEY secret is not set (or PR is from a fork). Skipping check.');
              return;
            }

            // 1. Read the calc engine files changed in this PR
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const calcFiles = files.filter(f => CALC.test(f.filename) && f.status !== 'removed');
            if (calcFiles.length === 0) {
              console.log('No calc engine files changed. Nothing to check.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            let material = `PR #${pull_number}: ${pr.title}\n\n${pr.body || ''}\n\n`;
            for (const f of calcFiles) {
              // Full file at the PR head, so the reviewer sees context around the diff
              let full = '';
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: pr.head.sha });
                full = Buffer.from(data.content, 'base64').toString('utf8');
              } catch (e) {
                if (fs.existsSync(f.filename)) full = fs.readFileSync(f.filename, 'utf8');
              }
              material += `===== FILE: ${f.filename} (${f.status}, +${f.additions}/-${f.deletions}) =====\n`;
              material += `----- DIFF -----\n${f.patch || '(diff too large for GitHub API; review full file)'}\n`;
              material += `----- FULL FILE AT PR HEAD -----\n${full}\n\n`;
            }
            if (material.length > MAX_CHARS) {
              core.warning(`Input truncated from ${material.length} to ${MAX_CHARS} chars.`);
              material = material.slice(0, MAX_CHARS);
            }

            // 2. Call Gemini with the BD & GEO checker prompt
            const systemPrompt = fs.readFileSync('.github/gemini/bd-geo-checker-prompt.md', 'utf8');
            const API = 'https://generativelanguage.googleapis.com/v1beta';
            const headers = { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY };
            const payload = JSON.stringify({
              systemInstruction: { parts: [{ text: systemPrompt }] },
              contents: [{ role: 'user', parts: [{ text: material }] }],
              generationConfig: { temperature: 0.2, maxOutputTokens: 16384 }
            });
            // Model not usable on this key: retired (404) or no quota on this tier (429 with limit 0)
            const unusable = (status, msg) => status === 404 || (status === 429 && /limit: 0/.test(msg || ''));

            const callModel = async (model) => {
              let res, json;
              for (let attempt = 1; attempt <= 3; attempt++) {
                res = await fetch(`${API}/models/${model}:generateContent`, { method: 'POST', headers, body: payload });
                json = await res.json().catch(() => ({}));
                if (res.ok || unusable(res.status, json.error?.message) || ![429, 500, 503].includes(res.status)) break;
                console.log(`${model} returned ${res.status}, retrying (${attempt}/3)...`);
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
              return { res, json };
            };

            // Models this key can call with generateContent
            const listModels = async () => {
              const r = await fetch(`${API}/models?pageSize=1000`, { headers });
              const j = await r.json().catch(() => ({}));
              return (j.models || [])
                .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
                .map(m => ({ id: m.name.replace(/^models\//, ''), display: m.displayName || '' }));
            };
            const models = await listModels();
            console.log('Models available on this key:\n' + models.map(m => `  ${m.id}  (${m.display})`).join('\n'));

            // Fallback: newest Flash model (free tier has no Pro quota)
            const flashModels = async () => models.map(m => m.id)
              .filter(n => /^gemini-[\d.]+-flash(-preview)?(-\d\d-\d{4})?$/.test(n))
              .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

            // Resolve GEMINI_MODEL: exact id, else match id / display name (e.g. "Gemini 4 Argon")
            const norm = t => t.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-|-$/g, '');
            const want = norm(process.env.GEMINI_MODEL);
            let model = process.env.GEMINI_MODEL;
            if (models.length && !models.some(m => m.id === model)) {
              const hits = models.filter(m => norm(m.id).includes(want) || norm(m.display).includes(want))
                .sort((a, b) => a.id.length - b.id.length);
              if (hits.length) { console.log(`Resolved "${model}" to ${hits[0].id}`); model = hits[0].id; }
              else core.warning(`"${model}" not found in this key's model list; trying it anyway.`);
            }
            let { res, json } = await callModel(model);
            const notes = [];
            if (!res.ok && unusable(res.status, json.error?.message)) {
              const why = (json.error?.message || '').split('\n')[0].slice(0, 200);
              console.log(`${model} not usable: ${res.status} ${why}`);
              notes.push(`\`${model}\` not usable on this API key (${res.status}: ${why}); fell back to Flash.`);
              for (const m of await flashModels()) {
                console.log(`Trying fallback model ${m}...`);
                ({ res, json } = await callModel(m));
                model = m;
                if (res.ok) break; // otherwise try the next Flash model
              }
            }
            process.env.GEMINI_MODEL = model; // shown in the review header
            if (!res.ok) {
              const msg = json.error?.message || res.statusText;
              await postReview(`:warning: Gemini API error ${res.status}: ${msg}`);
              core.setFailed(`Gemini API error ${res.status}: ${msg}`);
              return;
            }
            const text = (json.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
            const finish = json.candidates?.[0]?.finishReason;

            // 3. Post the result as a PR review comment
            await postReview((notes.length ? `> ${notes.join(' ')}\n\n` : '') + (text || `:warning: Gemini returned no text (finishReason: ${finish}).`));
            console.log(`Review posted (finishReason: ${finish}).`);
